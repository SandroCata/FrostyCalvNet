name: glacier-pytorch
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.10
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8
  - pip
  - pip:
    - matplotlib
    - scikit-learn
    - tqdm
    - tensorboard
    - ipykernel
    - numpy

#Execute in conda terminal to create and setup environment: conda env create -f environment.yml 